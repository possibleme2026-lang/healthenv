[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "healthenv"
version = "0.3.0"
description = "Compile longitudinal health QA into verifiable computer-use environments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "HealthEnv contributors"}]
keywords = ["computer-use-agent", "healthcare", "benchmark", "environment-synthesis", "rlvr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "ruff>=0.12",
]

[project.scripts]
healthenv = "healthenv.cli:main"

[project.urls]
Homepage = "https://github.com/possibleme2026-lang/healthenv"
Repository = "https://github.com/possibleme2026-lang/healthenv"

[tool.hatch.build.targets.wheel]
packages = ["src/healthenv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["generated", "paper", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/healthenv"]
